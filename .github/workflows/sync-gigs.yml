# Keeps the website's concert list in step with Nadav's Gigim calendar.
# Runs every morning (and on demand from the Actions tab): reads the calendar,
# rewrites public/assets/js/concerts.js, and commits it when
# something changed. Needs the repository secret GIGIM_ICS_URL (the calendar's
# public iCloud link).
name: Sync concerts from Gigim

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the calendar and write concerts.js
        env:
          GIGIM_ICS_URL: ${{ secrets.GIGIM_ICS_URL }}
        run: python3 tools/sync_gigim.py
      - name: Commit if the list changed
        run: |
          git diff --quiet -- public/assets/js/concerts.js && exit 0
          git config user.name "gigim-sync"
          git config user.email "gigim-sync@users.noreply.github.com"
          git add public/assets/js/concerts.js
          git commit -m "Update concerts from the Gigim calendar"
          git push
