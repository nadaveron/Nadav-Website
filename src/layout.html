<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nadav Friedman">
<meta property="og:locale" content="{{t:og_locale}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="https://www.nadavfriedman.com/assets/img/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="96x96" href="assets/img/favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400{{t:fonts}}&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":"Nadav Friedman","jobTitle":"{{t:job}}","url":"https://www.nadavfriedman.com","sameAs":["https://www.instagram.com/nadav.friedman/","https://www.facebook.com/nadav.friedman.5/","https://www.youtube.com/@nadavfriedmanmusic","https://open.spotify.com/artist/2chajUYdkxp1uYYrN9xVXb","https://music.apple.com/artist/nadav-friedman/1515865116","https://soundcloud.com/nadavfriedmanmusic"]}</script>
</head>
<body>
<a class="skip" href="#main">{{t:skip}}</a>
<header class="site-header">
  <div class="wrap">
    <nav class="nav" aria-label="{{t:nav_aria}}">{{nav}}</nav>
    <a class="logo-link" href="index.html" aria-label="{{t:home_aria}}"><img src="assets/img/mark.webp" alt="Nadav Friedman" width="200" height="240"></a>
    <div class="icons">{{icons}}{{langs}}</div>
    <details class="menu">
      <summary aria-label="{{t:menu_open}}">{{t:menu}}</summary>
      <div class="menu-panel">
        {{langs}}
        <nav class="nav" aria-label="{{t:nav_aria}}">{{nav}}</nav>
        <a class="btn small" href="https://chat.whatsapp.com/GjGj4pwP7kKLCDzW4AS8f1" target="_blank" rel="noopener"><span class="dot" aria-hidden="true"></span>{{t:wa_updates}}</a>
        <div class="icons">{{icons}}</div>
      </div>
    </details>
  </div>
</header>

<main id="main">
{{body}}
</main>

<!--wa--><section class="wa band" aria-labelledby="wa-title">
  <div class="wrap">
    <span class="kicker">{{t:wa_kicker}}</span>
    <h2 id="wa-title">{{t:wa_title}}</h2>
    <p>{{t:wa_text}}</p>
    <div class="qr">
      <a class="btn" href="https://chat.whatsapp.com/GjGj4pwP7kKLCDzW4AS8f1" target="_blank" rel="noopener"><span class="dot" aria-hidden="true"></span>{{t:wa_join}}</a>
      <img src="assets/img/whatsapp-qr.svg" alt="{{t:wa_qr_alt}}" width="128" height="128">
      <span>{{t:wa_scan}}</span>
    </div>
  </div>
</section>
<!--/wa-->

<footer class="site-footer">
  <div class="wrap">
    <span class="name">{{t:name}}</span>
    <div class="icons">{{icons}}</div>
    <span class="roles">{{t:roles}}</span>
    <img src="assets/img/logo.webp" alt="" width="430" height="640" loading="lazy">
    <small>© <span data-year>2026</span> · <a href="mailto:nadaveron@gmail.com">nadaveron@gmail.com</a> · <a href="https://drive.google.com/drive/folders/1b8dnxcE7DuAqPpzEX34NfdO_KH7HgGx2" target="_blank" rel="noopener">{{t:press}}</a></small>
  </div>
</footer>
<div class="player" data-player hidden>
  <audio src="assets/audio/shalosh.mp3" preload="metadata" loop></audio>
  <button type="button" class="pp" aria-label="{{t:play}}" aria-pressed="false">
    <svg class="i-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
  </button>
  <span class="np"><b>{{t:track}} <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></b><i>{{t:track_sub}}</i></span>
  <span class="bar" aria-hidden="true"><span></span></span>
</div>
<script src="assets/js/concerts.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
