<!-- {"title": "Contact · Nadav Friedman", "description": "Book percussionist Nadav Friedman for concerts, recordings, productions, lessons and masterclasses.", "nav": "contact", "path": "/contact"} -->
<section class="section contact-page" aria-labelledby="contact-title">
  <div class="wrap contact-layout">
    <h1 id="contact-title" class="sr-title">Contact</h1>
    <figure class="whole contact-photo">
      <img src="assets/photos/contact-cymbal.jpg" alt="Close-up of a drumstick resting on a cymbal in low light" width="1500" height="2000" fetchpriority="high">
      <figcaption class="credit">photo · Susana Jiménez</figcaption>
    </figure>
    <form class="contact" id="contact-form" novalidate>
      <div class="row2">
        <div class="field"><label for="f-name">Name</label><input id="f-name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
      </div>
      <div class="field">
        <label for="f-topic">What is it about?</label>
        <select id="f-topic" name="topic">
          <option data-key="session">Percussion for a concert or recording</option>
          <option data-key="bombaras">Book Bombaras</option>
          <option data-key="armon">Book the Itai Armon Ensemble</option>
          <option data-key="production">Bring Mirror or Alma de Bata</option>
          <option data-key="new">Create a new production</option>
          <option data-key="lessons">Lessons</option>
          <option data-key="workshop">Masterclass or workshop</option>
          <option data-key="press">Press</option>
          <option data-key="other">Something else</option>
        </select>
      </div>
      <div class="field"><label for="f-message">Message</label><textarea id="f-message" name="message" required placeholder="Date, place, and what you have in mind"></textarea></div>
      <div class="actions"><button class="btn" type="submit">Send message</button></div>
      <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
    </form>
  </div>
  <div class="wrap">
    <div class="icons contact-icons">{{icons}}</div>
  </div>
</section>
