<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 520" width="720" height="520" xmlns="http://www.w3.org/2000/svg" font-family="EB Garamond, Garamond, serif">
  <rect width="720" height="520" fill="#ffffff"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd890"/><stop offset=".7" stop-color="#e6a85a"/><stop offset="1" stop-color="#b9783f"/></radialGradient>
    <radialGradient id="brass" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#f1dcae"/><stop offset="1" stop-color="#c9a464"/></radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6b5a48"/></marker>
  </defs>

  <!-- audience -->
  <text x="380" y="20" text-anchor="middle" font-size="13" letter-spacing="3" fill="#6b5a48">AUDIENCE · FRONT OF STAGE</text>
  <line x1="380" y1="48" x2="380" y2="28" stroke="#6b5a48" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- rug -->
  <g id="rug">
    <rect x="140" y="58" width="500" height="410" rx="4" fill="#f4ebdc" stroke="#b08d65" stroke-width="2"/>
    <rect x="152" y="70" width="476" height="386" fill="none" stroke="#cdb391" stroke-dasharray="5 4"/>
    <text x="160" y="88" font-size="11" fill="#8a7357" font-style="italic">drum rug</text>
  </g>

  <!-- monitor, left -->
  <g id="monitor">
    <path d="M162 332 L210 332 L203 376 L169 376 Z" fill="#3a332c" stroke="#1d1813"/>
    <text x="186" y="390" text-anchor="middle" font-size="10.5">Monitor</text>
  </g>

  <!-- cymbals (right) -->
  <g id="cymbal-large">
    <circle cx="520" cy="150" r="62" fill="url(#brass)" stroke="#8a6a3c" stroke-width="1.6"/>
    <circle cx="520" cy="150" r="12" fill="#d9bd85" stroke="#8a6a3c"/>
    <text x="520" y="190" text-anchor="middle" font-size="11">Cymbal</text>
  </g>
  <g id="cymbal-small">
    <circle cx="568" cy="262" r="44" fill="url(#brass)" stroke="#8a6a3c" stroke-width="1.6"/>
    <circle cx="568" cy="262" r="10" fill="#d9bd85" stroke="#8a6a3c"/>
    <text x="568" y="294" text-anchor="middle" font-size="11">Cymbal</text>
  </g>
  <!-- bells & sounds on a long horizontal boom reaching the small cymbal -->
  <g id="bells">
    <line x1="568" y1="306" x2="568" y2="402" stroke="#6b6158" stroke-width="3"/>
    <circle cx="568" cy="410" r="9" fill="#bdb5ad" stroke="#6b6158"/>
    <g fill="url(#brass)" stroke="#8a6a3c">
      <circle cx="568" cy="318" r="8"/><circle cx="576" cy="336" r="10"/><circle cx="562" cy="356" r="9"/><circle cx="574" cy="376" r="7"/><circle cx="564" cy="392" r="7"/>
    </g>
    <text x="592" y="352" font-size="10.5">Bells &amp; sounds</text>
    <text x="592" y="366" font-size="9.5" fill="#6b5a48" font-style="italic">long boom arm</text>
  </g>

  <!-- bass drum (bombo), front head toward the audience -->
  <g id="bass-drum">
    <rect x="320" y="104" width="120" height="82" rx="10" fill="#e3cfae" stroke="#7d6243" stroke-width="2"/>
    <line x1="320" y1="112" x2="440" y2="112" stroke="#7d6243"/>
    <text x="380" y="146" text-anchor="middle" font-size="12.5" font-weight="600">Bass drum</text>
    <text x="380" y="161" text-anchor="middle" font-size="10.5" fill="#6b5a48">(bombo) · no port</text>
    <rect x="372" y="186" width="16" height="34" rx="3" fill="#bdb5ad" stroke="#6b6158"/>
  </g>

  <!-- snare: tight to the bass drum, left of the pedal; hi-hat on the same line, overlapping its left -->
  <g id="snare">
    <circle cx="322" cy="218" r="33" fill="#efe6d8" stroke="#7d6243" stroke-width="2"/>
    <text x="330" y="222" text-anchor="middle" font-size="11">Snare</text>
  </g>
  <g id="hihat">
    <circle cx="264" cy="218" r="32" fill="url(#brass)" stroke="#8a6a3c" stroke-width="1.6"/>
    <circle cx="264" cy="218" r="8" fill="#d9bd85" stroke="#8a6a3c"/>
    <text x="252" y="268" text-anchor="middle" font-size="11">Hi-hat · foot bell</text>
  </g>

  <!-- bombos (hand drums): small one tight to the bass drum right of the pedal, large one at its 5 o'clock -->
  <g id="bombo-1">
    <circle cx="446" cy="222" r="36" fill="#d8c2a0" stroke="#7d6243" stroke-width="2"/>
    <text x="446" y="214" text-anchor="middle" font-size="11">Bombo 1</text>
  </g>
  <g id="bombo-2">
    <circle cx="489" cy="297" r="44" fill="#d8c2a0" stroke="#7d6243" stroke-width="2"/>
    <text x="489" y="288" text-anchor="middle" font-size="11">Bombo 2</text>
  </g>
  <!-- sticks table directly under the large bombo -->
  <g id="sticks">
    <rect x="446" y="346" width="96" height="58" rx="4" fill="#fff" stroke="#6b5a48" stroke-width="1.6"/>
    <text x="494" y="380" text-anchor="middle" font-size="11">Sticks table</text>
  </g>

  <!-- drum chair right behind the bass drum pedal -->
  <g id="chair">
    <circle cx="380" cy="276" r="29" fill="#fff" stroke="#6b5a48" stroke-width="2"/>
    <text x="380" y="273" text-anchor="middle" font-size="11">Drum</text>
    <text x="380" y="286" text-anchor="middle" font-size="11">chair</text>
  </g>

  <!-- hand percussion on the lap: darbuka at the left of the chair, frame drum and riq behind it -->
  <g id="darbuka">
    <circle cx="306" cy="318" r="34" fill="#a7653a" stroke="#6e3f22" stroke-width="2"/>
    <circle cx="306" cy="318" r="26" fill="url(#glow)"/>
    <text x="306" y="322" text-anchor="middle" font-size="11">Darbuka</text>
    <text x="252" y="330" text-anchor="end" font-size="9.5" fill="#6b5a48" font-style="italic">with light</text>
  </g>
  <g id="frame-drum">
    <circle cx="252" cy="398" r="40" fill="#e9dcc3" stroke="#7d6243" stroke-width="2"/>
    <text x="252" y="402" text-anchor="middle" font-size="11">Frame drum</text>
  </g>
  <g id="riq">
    <circle cx="334" cy="404" r="25" fill="#e2d2b6" stroke="#7d6243" stroke-width="2"/>
    <g fill="url(#brass)" stroke="#8a6a3c">
      <circle cx="334" cy="377" r="7"/><circle cx="359" cy="396" r="7"/><circle cx="349" cy="426" r="7"/><circle cx="319" cy="426" r="7"/><circle cx="309" cy="396" r="7"/>
    </g>
    <text x="334" y="408" text-anchor="middle" font-size="11">Riq</text>
  </g>
  <g id="outlet">
    <rect x="196" y="300" width="26" height="18" rx="3" fill="#fff" stroke="#6b5a48"/>
    <circle cx="205" cy="309" r="2" fill="#6b5a48"/><circle cx="213" cy="309" r="2" fill="#6b5a48"/>
    <text x="190" y="313" text-anchor="end" font-size="10" fill="#6b5a48">230V</text>
  </g>

  <!-- microphones -->
  <g id="mics" font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="380" cy="90" r="11" fill="#9a4a2f"/><text x="380" y="94" fill="#fff">1</text>
    <circle cx="304" cy="192" r="11" fill="#9a4a2f"/><text x="304" y="196" fill="#fff">2</text>
    <circle cx="399" cy="242" r="11" fill="#9a4a2f"/><text x="399" y="246" fill="#fff">3</text>
    <circle cx="446" cy="238" r="11" fill="none" stroke="#9a4a2f" stroke-dasharray="3 2" stroke-width="1.6"/><text x="446" y="242" fill="#9a4a2f">4</text>
    <circle cx="489" cy="312" r="11" fill="none" stroke="#9a4a2f" stroke-dasharray="3 2" stroke-width="1.6"/><text x="489" y="316" fill="#9a4a2f">5</text>
    <circle cx="600" cy="104" r="11" fill="#9a4a2f"/><text x="600" y="108" fill="#fff">6</text>
    <line x1="591" y1="111" x2="566" y2="126" stroke="#9a4a2f" stroke-dasharray="3 3"/>
    <circle cx="606" cy="318" r="11" fill="#9a4a2f"/><text x="606" y="322" fill="#fff">7</text>
    <line x1="597" y1="324" x2="582" y2="334" stroke="#9a4a2f" stroke-dasharray="3 3"/>
    <circle cx="232" cy="190" r="11" fill="#9a4a2f"/><text x="232" y="194" fill="#fff">8</text>
  </g>

  <text x="390" y="500" text-anchor="middle" font-size="11" fill="#6b5a48" font-style="italic">Nadav’s left ←                                                             → Nadav’s right</text>
</svg>
